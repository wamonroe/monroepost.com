<!DOCTYPE html>
<html class="bg-indigo-300">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The MonroePost</title>
  <link href="/assets/css/main.css" rel="stylesheet">
</head>

<body>
  <div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center md:block md:p-0">
      <!-- This element is to trick the browser into centering the contents. -->
      <span class="hidden md:inline-block md:align-middle md:h-screen" aria-hidden="true">&#8203;</span>

      <div
        class="inline-block px-4 py-10 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl md:my-8 md:align-middle md:max-w-2xl md:w-full md:px-8">
        <div>
          <img src="assets/img/flowers.jpg" class="mx-auto rounded-full shadow-md w-52 h-52" />
          <div class="mt-8 text-center">
            <h1 class="font-serif text-3xl font-bold tracking-wide text-gray-900">
              The MonroePost
            </h1>
            <div class="mt-8 space-y-4">
              <p class="text-gray-700">
                You've reached our family domain!
              </p>
              <p class="text-gray-700">
                In the past we used this space to run a family blog, but 24 hours a day hasn't been enough to keep it
                up-to-date and invest in what is most important to us!
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
